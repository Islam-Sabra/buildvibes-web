<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BuildVibes</title>
<style>
  :root {
    --page: #F8F4EE;
    --card: #FFFFFF;
    --ink: #141B33;
    --muted: #6B6578;
    --line: #E5DFD6;
    --action: #C24417;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    font-size: 15px; line-height: 1.5;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  html[lang="ar"] body { font-size: 16px; }
  main {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 20px; padding: 28px 20px 20px;
    text-align: center;
  }
  .mark {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 800; letter-spacing: .04em; font-size: 13px;
  }
  .mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--action); display: inline-block; }
  h1 { font-size: 20px; line-height: 1.35; margin: 20px 0 24px; font-weight: 700; }
  html[lang="ar"] h1 { font-size: 22px; }
  a.button {
    display: block; text-decoration: none; border-radius: 999px;
    padding: 14px 16px; font-weight: 700; margin-top: 10px;
  }
  a.primary { background: var(--action); color: #FFFFFF; }
  .brand { direction: ltr; unicode-bidi: isolate; }
  .ask { color: var(--muted); margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <div class="mark"><i></i><span class="brand">BUILDVIBES</span></div>
  <h1 id="title"></h1>
  <a class="button primary" id="open" href="#"></a>
  <p class="ask" id="ask"></p>
</main>
<script>
  // Review 127, "Link domain for the pilot". Nothing is fetched: the page
  // reads only its own address, to open the same profile or company in the
  // app.
  (function () {
    // Until the app is on Google Play there is no store link (lead, 9 Nov):
    // the page asks for the app from the site lead. The day it goes onto
    // Play, the store link comes back together with the Play app signing
    // SHA-256 in assetlinks.json.
    var pkg = 'com.buildvibes.buildvibes';
    var path = location.pathname;
    var m = /^\/(p|c)\/([0-9a-fA-F-]{36})\/?$/.exec(path);
    var kind = m ? m[1] : null;
    var ar = (navigator.language || '').toLowerCase().indexOf('ar') === 0;
    var words = ar ? {
      p: 'هذا الملف على <span class="brand">BuildVibes</span>',
      c: 'صفحة هذه الشركة على <span class="brand">BuildVibes</span>',
      none: '<span class="brand">BuildVibes</span>',
      open: 'افتح في <span class="brand">BuildVibes</span>',
      ask: 'اطلب تطبيق <span class="brand">BuildVibes</span> من مسؤول الموقع'
    } : {
      p: 'This profile is on BuildVibes',
      c: 'This company page is on BuildVibes',
      none: 'BuildVibes',
      open: 'Open in BuildVibes',
      ask: 'Ask your site lead for the BuildVibes app'
    };
    if (ar) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    document.getElementById('title').innerHTML = words[kind || 'none'];
    document.getElementById('ask').innerHTML = words.ask;
    var open = document.getElementById('open');
    var android = /android/i.test(navigator.userAgent);
    if (!kind || !android) { open.style.display = 'none'; return; }
    // Opens the app when it is installed; without it the page stays.
    open.innerHTML = words.open;
    open.href = 'intent://' + location.host + path + '#Intent;scheme=https;package=' + pkg + ';end';
  })();
</script>
</body>
</html>
